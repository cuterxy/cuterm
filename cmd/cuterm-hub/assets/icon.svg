<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f37"/>
      <stop offset="1" stop-color="#141519"/>
    </linearGradient>
  </defs>

  <!-- app background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- lettermark: c u -->
  <g fill="none" stroke="#4e88c9" stroke-width="95" stroke-linecap="round">
    <!-- c: open ring, gap on the right -->
    <path d="M 440 404 A 130 130 0 1 0 440 616"/>
    <!-- u: two stems joined by a bottom arc -->
    <path d="M 600 375 V 555 A 95 95 0 0 0 790 555 V 375"/>
  </g>
</svg>
